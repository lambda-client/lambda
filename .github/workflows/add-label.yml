name: Pull Request Labeler
on:
  issues:
    types: [opened]
    branches:
      - master
  pull_request:
    types: [opened]
    branches:
      - master

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3.4
        with:
          configuration-path: .github/workflows/labeler/labeler-config.yml
          enable-versioned-regex: 0
          sync-labels: 0
          include-title: 1
          include-body: 0
          repo-token: ${{ github.token }}
